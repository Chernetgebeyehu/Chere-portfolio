 <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TaskFlow - Smart Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #8B5CF6;
      --primary-light: #A78BFA;
      --primary-dark: #7C3AED;
      --primary-surface: rgba(139, 92, 246, 0.08);
      --secondary: #F59E0B;
      --success: #10B981;
      --danger: #EF4444;
      --warning: #F59E0B;
      --info: #3B82F6;
      --bg: #F8F7FF;
      --bg-card: #FFFFFF;
      --bg-input: #F3F0FF;
      --text: #1a1a2e;
      --text-secondary: #71717a;
      --text-muted: #a1a1aa;
      --border: #e4e4e7;
      --shadow: 0 4px 20px rgba(139, 92, 246, 0.1);
      --shadow-lg: 0 10px 40px rgba(139, 92, 246, 0.15);
      --radius: 1rem;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dark-mode {
      --bg: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16162a;
      --text: #e4e4e7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --border: #2a2a40;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* ============ APP SHELL ============ */
    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--bg);
    }

    /* ============ HEADER ============ */
    .app-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 1.5rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    .app-header::before {
      content: '';
      position: absolute;
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .app-header::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .header-top h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-top h1 svg {
      width: 28px;
      height: 28px;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      backdrop-filter: blur(10px);
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .header-btn:active {
      transform: scale(0.95);
    }

    .header-greeting {
      margin-top: 1.25rem;
      position: relative;
      z-index: 1;
    }

    .header-greeting p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .header-greeting h2 {
      color: white;
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 0.25rem;
    }

    /* ============ STATS CARDS ============ */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      padding: 0 1.5rem;
      margin-top: -1.5rem;
      position: relative;
      z-index: 2;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
      cursor: default;
      border: 1px solid var(--border);
    }

    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .stat-card .stat-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-card .stat-lbl {
      font-size: 0.7rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-top: 0.15rem;
    }

    .stat-card:nth-child(2) .stat-num {
      color: var(--success);
    }

    .stat-card:nth-child(3) .stat-num {
      color: var(--secondary);
    }

    /* ============ SEARCH & ADD ============ */
    .action-bar {
      padding: 1.25rem 1.5rem;
      display: flex;
      gap: 0.75rem;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.75rem;
      border-radius: 0.875rem;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .add-btn {
      width: 50px;
      height: 50px;
      border-radius: 0.875rem;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
      flex-shrink: 0;
    }

    .add-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
    }

    .add-btn:active {
      transform: scale(0.95);
    }

    /* ============ FILTERS ============ */
    .filters {
      padding: 0 1.5rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin-bottom: 0.5rem;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 0.5rem 1.25rem;
      border-radius: 2rem;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-chip:hover {
      border-color: var(--primary-light);
      color: var(--primary);
    }

    .filter-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-chip .chip-count {
      background: rgba(255, 255, 255, 0.25);
      padding: 0.1rem 0.5rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .filter-chip:not(.active) .chip-count {
      background: var(--primary-surface);
      color: var(--primary);
    }

    /* ============ TASK LIST ============ */
    .task-section-label {
      padding: 0.75rem 1.5rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .task-list {
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-bottom: 6rem;
    }

    .task-item {
      background: var(--bg-card);
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 0.875rem;
      border: 1.5px solid var(--border);
      transition: var(--transition);
      animation: slideIn 0.3s ease forwards;
      cursor: default;
      position: relative;
      overflow: hidden;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: var(--shadow);
      transform: translateX(4px);
    }

    .task-item:active {
      transform: scale(0.98);
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-item.removing {
      animation: slideOut 0.3s ease forwards;
    }

    @keyframes slideOut {
      to {
        opacity: 0;
        transform: translateX(100px);
        height: 0;
        padding: 0;
        margin: 0;
        border: 0;
        overflow: hidden;
      }
    }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      margin-top: 2px;
    }

    .task-check:hover {
      border-color: var(--primary);
      background: var(--primary-surface);
    }

    .task-check.checked {
      background: var(--success);
      border-color: var(--success);
    }

    .task-check.checked svg {
      opacity: 1;
    }

    .task-check svg {
      width: 12px;
      height: 12px;
      opacity: 0;
      color: white;
      transition: var(--transition);
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
      transition: var(--transition);
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .task-category {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .cat-work {
      background: rgba(59, 130, 246, 0.1);
      color: #3B82F6;
    }

    .cat-personal {
      background: rgba(139, 92, 246, 0.1);
      color: #8B5CF6;
    }

    .cat-health {
      background: rgba(16, 185, 129, 0.1);
      color: #10B981;
    }

    .cat-study {
      background: rgba(245, 158, 11, 0.1);
      color: #F59E0B;
    }

    .cat-urgent {
      background: rgba(239, 68, 68, 0.1);
      color: #EF4444;
    }

    .task-due {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .task-due svg {
      width: 12px;
      height: 12px;
    }

    .task-priority {
      width: 4px;
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 4px 0 0 4px;
    }

    .priority-high {
      background: var(--danger);
    }

    .priority-medium {
      background: var(--warning);
    }

    .priority-low {
      background: var(--success);
    }

    .task-actions {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .task-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .task-action-btn:hover {
      background: var(--primary-surface);
      color: var(--primary);
    }

    .task-action-btn.delete:hover {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      color: var(--text-muted);
      opacity: 0.4;
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    .empty-state p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* ============ MODAL ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border-radius: 1.5rem 1.5rem 0 0;
      width: 100%;
      max-width: 480px;
      padding: 1.5rem;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 0 auto 1.25rem;
    }

    .modal h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .modal-field {
      margin-bottom: 1.25rem;
    }

    .modal-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .modal-input {
      width: 100%;
      padding: 0.875rem 1rem;
      border-radius: 0.875rem;
      border: 1.5px solid var(--border);
      background: var(--bg-input);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    .modal-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .modal-input::placeholder {
      color: var(--text-muted);
    }

    .category-options {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .category-option {
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      border: 1.5px solid var(--border);
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .category-option:hover {
      border-color: var(--primary-light);
    }

    .category-option.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .priority-options {
      display: flex;
      gap: 0.5rem;
    }

    .priority-option {
      flex: 1;
      padding: 0.75rem;
      border-radius: 0.875rem;
      border: 1.5px solid var(--border);
      background: transparent;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .priority-option:hover {
      transform: translateY(-2px);
    }

    .priority-option.selected {
      border-width: 2px;
    }

    .priority-option.p-high {
      color: var(--danger);
    }

    .priority-option.p-high.selected {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
    }

    .priority-option.p-medium {
      color: var(--warning);
    }

    .priority-option.p-medium.selected {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--warning);
    }

    .priority-option.p-low {
      color: var(--success);
    }

    .priority-option.p-low.selected {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--success);
    }

    .modal-submit {
      width: 100%;
      padding: 1rem;
      border-radius: 0.875rem;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
      margin-top: 0.5rem;
    }

    .modal-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(139, 92, 246, 0.4);
    }

    .modal-submit:active {
      transform: scale(0.98);
    }

    /* ============ BACK LINK ============ */
    .back-link {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 2rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 99;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
    }

    .back-link:hover {
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 10px 40px rgba(139, 92, 246, 0.25);
      border-color: var(--primary);
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      top: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 0.875rem 1.5rem;
      border-radius: 0.875rem;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      z-index: 9999;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-success {
      background: var(--success);
    }

    .toast-error {
      background: var(--danger);
    }

    .toast-info {
      background: var(--primary);
    }

    /* ============ CONFETTI ============ */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 9998;
      animation: confettiFall 3s ease-in forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <!-- HEADER -->
    <header class="app-header">
      <div class="header-top">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          TaskFlow
        </h1>
        <div class="header-actions">
          <button class="header-btn" onclick="toggleDarkMode()" title="Toggle theme">
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" style="display:none">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
          <button class="header-btn" onclick="clearCompleted()" title="Clear completed">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            </svg>
          </button>
        </div>
      </div>
      <div class="header-greeting">
        <p id="greeting-text">Good Morning</p>
        <h2>Cherinet Gebeyehu</h2>
      </div>
    </header>
    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-lbl">Total Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-done">0</div>
        <div class="stat-lbl">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">0</div>
        <div class="stat-lbl">Pending</div>
      </div>
    </div>
    <!-- SEARCH & ADD -->
    <div class="action-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search tasks..." oninput="renderTasks()">
      </div>
      <button class="add-btn" onclick="openModal()" title="Add task">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>
    <!-- FILTERS -->
    <div class="filters" id="filters"></div>
    <!-- TASK LIST -->
    <div id="task-container"></div>
  </div>
  <!-- ADD TASK MODAL -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>New Task</h3>
      <div class="modal-field">
        <label>Task Title</label>
        <input type="text" class="modal-input" id="task-title-input" placeholder="What needs to be done?"
          maxlength="100">
      </div>
      <div class="modal-field">
        <label>Due Date</label>
        <input type="date" class="modal-input" id="task-date-input">
      </div>
      <div class="modal-field">
        <label>Category</label>
        <div class="category-options" id="category-options">
          <button class="category-option selected" data-cat="personal" onclick="selectCategory(this)">Personal</button>
          <button class="category-option" data-cat="work" onclick="selectCategory(this)">Work</button>
          <button class="category-option" data-cat="study" onclick="selectCategory(this)">Study</button>
          <button class="category-option" data-cat="health" onclick="selectCategory(this)">Health</button>
          <button class="category-option" data-cat="urgent" onclick="selectCategory(this)">Urgent</button>
        </div>
      </div>
      <div class="modal-field">
        <label>Priority</label>
        <div class="priority-options">
          <button class="priority-option p-low selected" data-priority="low" onclick="selectPriority(this)">Low</button>
          <button class="priority-option p-medium" data-priority="medium" onclick="selectPriority(this)">Medium</button>
          <button class="priority-option p-high" data-priority="high" onclick="selectPriority(this)">High</button>
        </div>
      </div>
      <button class="modal-submit" onclick="addTask()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          style="display:inline;vertical-align:middle;margin-right:6px">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Add Task
      </button>
    </div>
  </div>
  <!-- BACK LINK -->
  <a href="index.html" class=" back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12" />
      <polyline points="12 19 5 12 12 5" />
    </svg>
    Back to Portfolio
  </a>
  <!-- TOAST -->
  <div class="toast" id="toast"></div>
  <script>
    // ============ DATA ============
    let tasks = JSON.parse(localStorage.getItem('taskflow-tasks')) || [
      { id: 1, title: 'Complete portfolio redesign', category: 'work', priority: 'high', due: '2025-02-15', completed: false },
      { id: 2, title: 'Study React hooks in depth', category: 'study', priority: 'medium', due: '2025-02-10', completed: false },
      { id: 3, title: 'Morning workout routine', category: 'health', priority: 'low', due: '', completed: true },
      { id: 4, title: 'Submit Udacity project', category: 'urgent', priority: 'high', due: '2025-02-08', completed: false },
      { id: 5, title: 'Read Clean Code chapter 5', category: 'personal', priority: 'low', due: '2025-02-20', completed: false },
      { id: 6, title: 'Practice Kotlin coroutines', category: 'study', priority: 'medium', due: '2025-02-12', completed: false },
      { id: 7, title: 'Update GitHub README files', category: 'work', priority: 'low', due: '', completed: true },
    ];
    let activeFilter = 'all';
    let selectedCategory = 'personal';
    let selectedPriority = 'low';
    // ============ GREETING ============
    function updateGreeting() {
      const hour = new Date().getHours();
      const el = document.getElementById('greeting-text');
      if (hour < 12) el.textContent = 'Good Morning ☀️';
      else if (hour < 17) el.textContent = 'Good Afternoon 🌤️';
      else if (hour < 21) el.textContent = 'Good Evening 🌅';
      else el.textContent = 'Good Night 🌙';
    }
    updateGreeting();
    // ============ DARK MODE ============
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('taskflow-theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon-moon').style.display = isDark ? 'none' : 'block';
      document.getElementById('theme-icon-sun').style.display = isDark ? 'block' : 'none';
    }
    (function () {
      if (localStorage.getItem('taskflow-theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-icon-moon').style.display = 'none';
        document.getElementById('theme-icon-sun').style.display = 'block';
      }
    })();
    // ============ SAVE ============
    function saveTasks() {
      localStorage.setItem('taskflow-tasks', JSON.stringify(tasks));
    }
    // ============ STATS ============
    function updateStats() {
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const pending = total - done;
      animateStat('stat-total', total);
      animateStat('stat-done', done);
      animateStat('stat-pending', pending);
    }
    function animateStat(id, target) {
      const el = document.getElementById(id);
      const current = parseInt(el.textContent) || 0;
      if (current === target) return;
      const diff = target - current;
      const step = diff > 0 ? 1 : -1;
      let val = current;
      const interval = setInterval(function () {
        val += step;
        el.textContent = val;
        if (val === target) clearInterval(interval);
      }, 50);
    }
    // ============ FILTERS ============
    function renderFilters() {
      const categories = ['all', 'personal', 'work', 'study', 'health', 'urgent'];
      const labels = { all: '📋 All', personal: '👤 Personal', work: '💼 Work', study: '📚 Study', health: '💪 Health', urgent: '🔥 Urgent' };
      const container = document.getElementById('filters');
      container.innerHTML = '';
      categories.forEach(function (cat) {
        const count = cat === 'all' ? tasks.length : tasks.filter(t => t.category === cat).length;
        const chip = document.createElement('button');
        chip.className = 'filter-chip' + (activeFilter === cat ? ' active' : '');
        chip.innerHTML = labels[cat] + ' <span class="chip-count">' + count + '</span>';
        chip.onclick = function () {
          activeFilter = cat;
          renderFilters();
          renderTasks();
        };
        container.appendChild(chip);
      });
    }
    // ============ RENDER TASKS ============
    function renderTasks() {
      const container = document.getElementById('task-container');
      const search = document.getElementById('search-input').value.toLowerCase();
      let filtered = tasks.filter(function (t) {
        const matchCat = activeFilter === 'all' || t.category === activeFilter;
        const matchSearch = t.title.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });
      const pending = filtered.filter(t => !t.completed);
      const completed = filtered.filter(t => t.completed);
      let html = '';
      if (filtered.length === 0) {
        html = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg><h3>No tasks found</h3><p>Tap + to add your first task</p></div>';
      } else {
        if (pending.length > 0) {
          html += '<div class="task-section-label">Pending (' + pending.length + ')</div>';
          html += '<div class="task-list">';
          pending.forEach(function (t, i) {
            html += buildTaskHTML(t, i * 0.05);
          });
          html += '</div>';
        }
        if (completed.length > 0) {
          html += '<div class="task-section-label" style="margin-top:0.5rem">Completed (' + completed.length + ')</div>';
          html += '<div class="task-list">';
          completed.forEach(function (t, i) {
            html += buildTaskHTML(t, i * 0.05);
          });
          html += '</div>';
        }
      }
      container.innerHTML = html;
      updateStats();
      renderFilters();
    }
    function buildTaskHTML(task, delay) {
      var dueText = '';
      if (task.due) {
        var d = new Date(task.due);
        var opts = { month: 'short', day: 'numeric' };
        dueText = '<span class="task-due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + d.toLocaleDateString('en-US', opts) + '</span>';
      }
      return '<div class="task-item' + (task.completed ? ' completed' : '') + '" style="animation-delay:' + delay + 's">' +
        '<div class="task-priority priority-' + task.priority + '"></div>' +
        '<div class="task-check' + (task.completed ? ' checked' : '') + '" onclick="toggleTask(' + task.id + ')">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' +
        '</div>' +
        '<div class="task-info">' +
        '<div class="task-title">' + escapeHtml(task.title) + '</div>' +
        '<div class="task-meta">' +
        '<span class="task-category cat-' + task.category + '">' + task.category + '</span>' +
        dueText +
        '</div>' +
        '</div>' +
        '<div class="task-actions">' +
        '<button class="task-action-btn delete" onclick="deleteTask(' + task.id + ')" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>' +
        '</div>' +
        '</div>';
    }
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
    // ============ TOGGLE TASK ============
    function toggleTask(id) {
      var task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
        if (task.completed) {
          showToast('Task completed! 🎉', 'success');
          launchConfetti();
        }
      }
    }
    // ============ DELETE TASK ============
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
      showToast('Task deleted', 'info');
    }
    // ============ CLEAR COMPLETED ============
    function clearCompleted() {
      var count = tasks.filter(t => t.completed).length;
      if (count === 0) {
        showToast('No completed tasks to clear', 'info');
        return;
      }
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
      showToast(count + ' completed task(s) cleared', 'success');
    }
    // ============ MODAL ============
    function openModal() {
      document.getElementById('modal-overlay').classList.add('active');
      setTimeout(function () {
        document.getElementById('task-title-input').focus();
      }, 300);
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      document.getElementById('task-title-input').value = '';
      document.getElementById('task-date-input').value = '';
    }
    function closeModalOutside(e) {
      if (e.target === document.getElementById('modal-overlay')) {
        closeModal();
      }
    }
    function selectCategory(el) {
      document.querySelectorAll('.category-option').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedCategory = el.dataset.cat;
    }
    function selectPriority(el) {
      document.querySelectorAll('.priority-option').forEach(b => b.classList.remove('selected'));
      el.classList.add('selected');
      selectedPriority = el.dataset.priority;
    }
    function addTask() {
      var title = document.getElementById('task-title-input').value.trim();
      var due = document.getElementById('task-date-input').value;
      if (!title) {
        showToast('Please enter a task title', 'error');
        document.getElementById('task-title-input').focus();
        return;
      }
      var newTask = {
        id: Date.now(),
        title: title,
        category: selectedCategory,
        priority: selectedPriority,
        due: due,
        completed: false
      };
      tasks.unshift(newTask);
      saveTasks();
      renderTasks();
      closeModal();
      showToast('Task added successfully! ✨', 'success');
    }
    // Enter key to add task
    document.getElementById('task-title-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addTask();
    });
    // ============ TOAST ============
    function showToast(message, type) {
      var toast = document.getElementById('toast');
      var icons = {
        success: '✅',
        error: '❌',
        info: 'ℹ️'
      };
      toast.innerHTML = (icons[type] || '') + ' ' + message;
      toast.className = 'toast toast-' + (type || 'info') + ' show';
      setTimeout(function () { toast.classList.remove('show'); }, 3000);
    }
    // ============ CONFETTI ============
    function launchConfetti() {
      var colors = ['#8B5CF6', '#A78BFA', '#F59E0B', '#10B981', '#3B82F6', '#EF4444'];
      for (var i = 0; i < 30; i++) {
        var confetti = document.createElement('div');
        confetti.className = 'confetti-piece';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.width = (Math.random() * 8 + 5) + 'px';
        confetti.style.height = (Math.random() * 8 + 5) + 'px';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confetti.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(confetti);
        setTimeout(function () { confetti.remove(); }, 4000);
      }
    }
    // ============ INIT ============
    renderTasks();
  </script>
</body>

</html>
